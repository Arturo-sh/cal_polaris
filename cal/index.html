<!-- Lenguaje: HTML con JavaScript -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calendario Trabajo Grupo Morado</title>

  <!-- FullCalendar CSS -->
  <!--<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">-->
  <link rel="stylesheet" href="./css/skeleton.css">
  <link rel="stylesheet" href="./css/themes/monarch/theme.css">
  <link rel="stylesheet" href="./css/themes/monarch/palettes/purple.css">
  
  <!-- FullCalendar JS -->
  <!--<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>-->
  <script src="./js/fullcalendar.global.js"></script>
  <script src="./js/locales-all/global.js"></script>
  <script src="./js/data.js"></script>
  <script src="./css/themes/monarch/global.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const eventosJSON = trabajo2026;
      // Inicialización del calendario
      const calendarEl = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarEl, {
        height: '100%',
        expandRows: true,
        locale: 'es', // Idioma español
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,multiMonthYear,listWeek,listMonth,listYear'
        },
        initialView: 'dayGridMonth',
        titleFormat: { // will produce something like "Tuesday, September 18, 2018"
          month: 'short',
          year: 'numeric',
          day: 'numeric',
          weekday: 'short'
        },
        dayHeaderFormat: { weekday: 'long', month: 'numeric', day: 'numeric', omitCommas: true },
        listDayAltFormat: {
          month: 'long',
          year: 'numeric',
          day: 'numeric',
          weekday: 'long'
        },
        weekNumbers: true,
        weekNumberFormat: {
          week: 'narrow'
        },
        firstDay: 1,
        listText: false,
        navLinks: true, // can click day/week names to navigate views
        nowIndicator: true,
        dayMaxEvents: true, // allow "more" link when too many events
        dayMaxEventRows: 1,
        showNonCurrentDates: false,
        events: eventosJSON // Carga de eventos desde JSON
      });

      calendar.render();
    });
  </script>

  <style>
    html, body {
      overflow: hidden; /* don't do scrollbars */
    }

    body {
      font-family: Arial, Helvetica Neue, Helvetica, sans-serif;
      font-size: 14px;
    }

    #calendar-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .fc-header-toolbar {
      /*
      the calendar will be butting up against the edges,
      but let's scoot in the header's buttons
      */
      padding-top: 1em;
      padding-left: 1em;
      padding-right: 1em;
    }

    #calendar {
      max-width: 900px;
      margin: 40px auto;
    }
  </style>
</head>
<body>
  <!--<body data-color-scheme="dark">-->
  <div id='calendar-container'>
    <div id='calendar'></div>
  </div>
</body>
</html>
